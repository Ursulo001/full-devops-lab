---
# tasks file for isntall-k3s
- name: Installer K3s via le script officiel
  become: yes
  ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s  # idempotent : ne réinstalle pas si déjà présent

- name: Vérifier que K3s tourne
  become: yes
  ansible.builtin.command: k3s --version
  register: k3s_version

- name: Afficher la version installée
  ansible.builtin.debug:
    msg: "{{ k3s_version.stdout }}"