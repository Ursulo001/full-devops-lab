# tasks file for install-docker

- name: Vérifier si Docker est installé
  command: docker --version
  register: docker_check
  ignore_errors: yes
  changed_when: false

- name: Installer docker.io si nécessaire
  become: yes
  apt:
    name: docker.io
    state: present
    update_cache: yes
  when: docker_check.rc != 0

