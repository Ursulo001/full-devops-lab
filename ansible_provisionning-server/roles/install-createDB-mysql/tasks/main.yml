---
- name: Installer MariaDB
  become: yes
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
      - python3-pymysql   # requis par les modules community.mysql
    state: present
    update_cache: yes

- name: Démarrer et activer le service MariaDB
  become: yes
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: yes

- name: Autoriser les connexions distantes
  become: yes
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^bind-address'
    line: "bind-address = {{ mariadb_bind_address }}"
    backup: yes
  notify: Restart MariaDB

- name: Définir le mot de passe root MariaDB
  become: yes
  community.mysql.mysql_user:
    name: root
    password: "{{ mariadb_root_password }}"
    login_unix_socket: /run/mysqld/mysqld.sock
    check_implicit_admin: yes

- name: Créer un fichier .my.cnf pour l'authentification root future
  become: yes
  ansible.builtin.template:
    src: my.cnf.j2
    dest: /root/.my.cnf
    mode: '0600'

- name: Créer les bases de données
  become: yes
  community.mysql.mysql_db:
    name: "{{ item.name }}"
    state: present
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  loop: "{{ mariadb_databases }}"

- name: Créer les utilisateurs applicatifs
  become: yes
  community.mysql.mysql_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    priv: "{{ item.priv }}"
    host: "{{ item.host }}"
    state: present
    login_user: root
    login_password: "{{ mariadb_root_password }}"
  loop: "{{ mariadb_users }}"
  no_log: true   # évite d'afficher les mots de passe dans les logs Ansible