---
# tasks file for install-jenkins

- name: Installer la configuration (fontconfig)
  become: yes
  ansible.builtin.apt:
    name: fontconfig
    state: present
    update_cache: true

- name: Installer openjdk
  become: yes
  ansible.builtin.apt:
    name: openjdk-21-jdk
    state: present
    update_cache: true

- name: Vérifier que java est bien installé
  ansible.builtin.command: java --version
  register: java_version
  changed_when: false

- name: Afficher la version de java
  ansible.builtin.debug:
    var: java_version.stderr_lines

- name: Créer le dossier keyrings si absent
  become: yes
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Importer la clé GPG officielle Jenkins 2026
  become: yes
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
    dest: /etc/apt/keyrings/jenkins-keyring.asc
    mode: '0644'

- name: Ajouter le dépôt APT Jenkins
  become: yes
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins

- name: Update cache
  become: yes
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Installer jenkins
  become: yes
  ansible.builtin.apt:
    name: jenkins
    state: present
    update_cache: true

- name: Activer et démarrer jenkins
  become: yes
  ansible.builtin.systemd:
    name: jenkins
    enabled: yes
    state: started

- name: Attendre que Jenkins génère le mot de passe initial
  become: yes
  ansible.builtin.wait_for:
    path: /var/lib/jenkins/secrets/initialAdminPassword
    timeout: 60

- name: Lire le mot de passe administrateur initial
  become: yes
  ansible.builtin.slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_password_file

- name: Afficher le mot de passe administrateur initial
  ansible.builtin.debug:
    msg: "Mot de passe initial Jenkins : {{ jenkins_password_file.content | b64decode | trim }}"
    